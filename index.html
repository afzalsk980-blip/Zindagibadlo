<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Zindagi Badlo — Donate</title>
<meta name="description" content="Aapka chhota sa yogdan — kisi ki zindagi ki nayi shuruaat">
<style>
  body{font-family:Inter,system-ui,sans-serif;margin:0;background:#fff8f9;color:#111}
  .wrap{max-width:720px;margin:24px auto;padding:18px}
  .hero{background:linear-gradient(180deg,#fff 0%,#ffeef0 100%);border-radius:12px;padding:18px;display:flex;gap:12px;align-items:center}
  .photo{width:100px;height:100px;border-radius:10px;background:#ffdede;display:flex;align-items:center;justify-content:center;font-size:28px}
  .btn{background:#d63447;color:#fff;padding:10px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:700}
  .card{background:#fff;border:1px solid #f0d7da;border-radius:10px;padding:16px;margin-top:14px}
  textarea,input{width:100%;padding:8px;border-radius:8px;border:1px solid #eee;margin-top:5px}
  .post{border:1px solid #fbe9ec;padding:8px;margin-top:6px;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="photo">❤️</div>
    <div>
      <h2>आपका छोटा सा योगदान — किसी की ज़िन्दगी की नई शुरुआत</h2>
      <p>Ek plate khana, ek muskurahat — aaj donate karke farq layein</p>
    </div>
  </div>

  <div class="card">
    <h3>Donate via UPI</h3>
    <p><b>UPI ID:</b> afzalsk980-3@oksbi</p>
    <label>Amount (₹)</label>
    <input id="amt" type="number" placeholder="100"/>
    <button class="btn" onclick="pay()">Open UPI App</button>
  </div>

  <div class="card">
    <h3>Wall — लोगों के संदेश</h3>
    <textarea id="msg" rows="3" placeholder="Main ne donate kiya..."></textarea>
    <button class="btn" onclick="postMsg()">Post</button>
    <div id="wall"></div>
  </div>

  <div class="card">
    <h3>Share this page</h3>
    <button class="btn" onclick="share()">Copy Link</button>
  </div>
</div>

<script>
function pay(){
  let amt=document.getElementById('amt').value||'0';
  window.location.href=`upi://pay?pa=afzalsk980-3@oksbi&pn=ZindagiBadlo&am=${amt}&cu=INR`;
}
function postMsg(){
  let t=document.getElementById('msg').value.trim();
  if(!t)return alert('Write message!');
  let d=JSON.parse(localStorage.getItem('wall')||'[]');
  d.push({t,dt:new Date().toLocaleString()});
  localStorage.setItem('wall',JSON.stringify(d));
  document.getElementById('msg').value='';
  load();
}
function load(){
  let d=JSON.parse(localStorage.getItem('wall')||'[]');
  let w=document.getElementById('wall'); w.innerHTML='';
  d.slice().reverse().forEach(p=>{
    let el=document.createElement('div');el.className='post';el.innerHTML=`<div>${p.t}</div><small>${p.dt}</small>`;
    w.appendChild(el);
  });
}
load();
function share(){
  navigator.clipboard.writeText(location.href);
  alert('Link copied!');
}
</script>
</body>
</html>
